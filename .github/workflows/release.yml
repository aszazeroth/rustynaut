name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build broker
        run: cargo build --release --package broker --target ${{ matrix.target }}

      - name: Build client
        run: cargo build --release --package client --target ${{ matrix.target }}

      - name: Prepare files (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p rustynaut-${{ env.VERSION }}-${{ matrix.platform }}
          cp target/${{ matrix.target }}/release/broker rustynaut-${{ env.VERSION }}-${{ matrix.platform }}/
          cp target/${{ matrix.target }}/release/client rustynaut-${{ env.VERSION }}-${{ matrix.platform }}/
          cp README.md LICENSE rustynaut-${{ env.VERSION }}-${{ matrix.platform }}/

      - name: Prepare files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir rustynaut-${{ env.VERSION }}-${{ matrix.platform }}
          copy target\${{ matrix.target }}\release\broker.exe rustynaut-${{ env.VERSION }}-${{ matrix.platform }}\
          copy target\${{ matrix.target }}\release\client.exe rustynaut-${{ env.VERSION }}-${{ matrix.platform }}\
          copy README.md LICENSE rustynaut-${{ env.VERSION }}-${{ matrix.platform }}\

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: tar czf rustynaut-${{ env.VERSION }}-${{ matrix.platform }}.tar.gz rustynaut-${{ env.VERSION }}-${{ matrix.platform }}

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path rustynaut-${{ env.VERSION }}-${{ matrix.platform }} `
                           -DestinationPath rustynaut-${{ env.VERSION }}-${{ matrix.platform }}.zip

      - name: Generate checksums (Unix)
        if: runner.os != 'Windows'
        run: sha256sum rustynaut-${{ env.VERSION }}-${{ matrix.platform }}.tar.gz > checksums-${{ matrix.platform }}.txt

      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = "rustynaut-${{ env.VERSION }}-${{ matrix.platform }}.zip"
          $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash
          "$hash  $file" | Out-File -FilePath checksums-${{ matrix.platform }}.txt -Encoding ASCII

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: |
            rustynaut-${{ env.VERSION }}-*
            checksums-*.txt
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "rustynaut-*" -o -name "checksums-*" \) -exec mv {} release/ \;
          cd release
          ls -la
          cat checksums-*.txt > SHA256SUMS
          echo "=== SHA256SUMS ===" && cat SHA256SUMS
          rm checksums-*.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
